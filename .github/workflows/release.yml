name: release

# Tag-triggered release: test gate -> multi-arch image -> ghcr. Mirrors the
# BIJOTEL release workflow (proven end-to-end on v2.15.1, 2026-06-12) so the
# federation image is never a manual push again.
#
# The FIRST push from Actions auto-links the package to this repo, so the
# GITHUB_TOKEN keeps write access (the ghcr ACL trap hit by BIJOTEL — a
# package created by a manual PAT push denies GITHUB_TOKEN with
# permission_denied: write_package — never arms here).
#
# Multi-arch (amd64 + arm64) because the production host (ARA) is arm64;
# an amd64-only image would be undeployable where it actually runs.
#
# Release flow: bump version in pyproject.toml + src/bijotel_federation/
# __init__.py + CHANGELOG, commit, then `git tag vX.Y.Z && git push origin vX.Y.Z`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Gate — a release never ships if tests or lint fail.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  # Multi-arch image -> ghcr.io (tag X.Y.Z without the leading v, plus :latest).
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # Guard: the git tag must equal the packaged version, so we can never
      # publish vX.Y.Z while pyproject still says something else.
      - run: |
          PKG=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG=${GITHUB_REF_NAME#v}
          echo "tag=$TAG pyproject=$PKG"
          test "$PKG" = "$TAG" || { echo "::error::tag $TAG != pyproject version $PKG"; exit 1; }
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/octavuntila-prog/bijotel-federation:${{ steps.ver.outputs.v }}
            ghcr.io/octavuntila-prog/bijotel-federation:latest
